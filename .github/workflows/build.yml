name: Build Elara

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Resolve version
        id: version
        run: |
          version=$(sed -n 's/^modVersion=//p' gradle.properties | tr -d '\r')
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
      - name: Build, test and verify the remapped JAR
        run: ./gradlew --no-daemon build :minecraft-mod:verifyRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Linux'
        with:
          name: elara-jar
          path: minecraft-mod/build/libs/elara-${{ steps.version.outputs.number }}.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: elara-jar
      - name: Publish verified JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "elara-${GITHUB_REF_NAME#v}.jar" \
            --verify-tag --title "Elara $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
